<text x="58" y="135" font-size="20" fill="#16181D">an oblique vase, 20 cm</text>
<text x="40" y="178" font-size="15" fill="#59636E" letter-spacing="1">IT READS</text>
<rect x="40" y="190" width="135" height="32" rx="16" fill="#F4F4F0" stroke="#16181D"/><text x="107" y="211" text-anchor="middle" font-size="15" fill="#16181D" font-weight="600">Vessel › Vase</text><rect x="184.6" y="190" width="118" height="32" rx="16" fill="#F4F4F0" stroke="#E5E1D8"/><text x="244" y="211" text-anchor="middle" font-size="15" fill="#16181D">slanted rim</text><rect x="312.79999999999995" y="190" width="135" height="32" rx="16" fill="#F4F4F0" stroke="#E5E1D8"/><text x="380" y="211" text-anchor="middle" font-size="15" fill="#16181D">Height 200 mm</text>
<text x="40" y="270" font-size="15" fill="#59636E">STL and 3MF to print, SVG to cut. No AI model; nothing leaves your computer.</text>
