<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t">
<title id="t">Typing “an oblique vase, 20 cm” into Saymake gives a vase 200 mm tall whose top is cut at a slant, ready to download as STL or 3MF.</title>
<rect width="880" height="330" fill="#FAFAF7"/>
<g font-family="Outfit, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="40" y="86" font-size="15" fill="#59636E" letter-spacing="1">YOU TYPE</text>
