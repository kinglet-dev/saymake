name: Release

# Pushing a version tag (v1.2.3) builds the release as a draft on GitHub:
# the page as one file, the kit another page embeds, the WebAssembly tool
# with Go's runner and its license, an SBOM and SHA-256 checksums. The draft
# is published by hand after a last look.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests with race detector and coverage
        run: |
          go vet ./...
          go tool ginkgo -r --race --cover --coverprofile=coverage.out --skip-package=e2e
          scripts/check-coverage.sh coverage.out
          go tool ginkgo ./e2e
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Build the release's files
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
